<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clients</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
<div class="container">
    <header class="header">
        <div class="brand">
            <div class="logo">FA</div>
            <div>
                <div class="title">Freelance Admin</div>
                <div class="sub">Clients Overview</div>
            </div>
        </div>
        <a href="/" class="btn secondary">← Dashboard</a>
    </header>

    <section class="table-section">
        <h1>Clients List</h1>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Client Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Company</th>
                    <th>Address</th>
                </tr>
            </thead>
            <tbody>
                {% for client in clients %}
                <tr>
                    <td>{{ client.id }}</td>
                    <td>{{ client.name }}</td>
                    <td>{{ client.email }}</td>
                    <td>{{ client.phone }}</td>
                    <td>{{ client.company_name }}</td>
                    <td>{{ client.address }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </section>

    <div class="dashboard-actions">
        <a href="/web/projects" class="btn">Go to Projects</a>
        <a href="/" class="btn secondary">Back to Dashboard</a>
    </div>
</div>
</body>
</html>
